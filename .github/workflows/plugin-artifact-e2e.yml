name: Plugin artifact E2E

on:
  pull_request:
    paths:
      - ".github/workflows/plugin-artifact-e2e.yml"
      - "cli/**"
      - "plugins/impact-lens/**"
      - "scripts/test-plugin-artifact-e2e.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  packed-plugin-e2e:
    name: ${{ matrix.os }} / Node 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@10.34.5
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run packed Plugin E2E
        run: npm run test:plugin-artifact
