name: Unit tests

# The packed-artifact E2E is a 3-OS, 15-minute integration gate; these are the fast in-repo suites
# that guard src/** and cli/src/** logic. They are kept in their own workflow so a logic regression
# and a packaging regression never share a check name, and so this one can also run on main pushes
# without paying for the E2E matrix again.
on:
  pull_request: {}
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Node 22 / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@10.34.5
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Extension unit tests
        run: npm test
      - name: Run Agent CLI tests
        run: npm run cli:test
      - name: Run plugin response-policy eval
        run: npm run test:response-policy

  # cli:test only, on the two OSes `unit` above does not cover - not a matrix merge with `unit` because
  # this fix's whole point is proving cli:test now works cross-OS, not adding to what `unit` already
  # proves about ubuntu. Deliberately does NOT run `npm test` (the Extension suite): that suite has never
  # run outside ubuntu either and likely has its own undiscovered non-POSIX assumptions, but widening this
  # job to it would risk an open-ended cascade of unrelated fixes - tracked as a follow-up instead (see
  # docs/work/task-fix-cli-test-windows-compat.md).
  cli-tests-cross-os:
    name: cli:test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@10.34.5
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Agent CLI tests
        run: npm run cli:test

  # Separate from `unit` on purpose (M2 gopls preset, stage 3): a Go toolchain or gopls install failure
  # here must never hide or delay the Extension/CLI unit results above, and this job's OS matrix is not
  # worth paying for on every push to `unit`. IMPACT_LENS_REQUIRE_GOPLS=1 turns the gopls-gated rows in
  # `stateReachability.integration.test.ts` from an optional local skip into a hard failure here, so this
  # job cannot go green without actually having exercised a real gopls end to end - see
  # docs/work/task-m2-gopls-ci-verification.md for why a silent skip was rejected.
  go-provider:
    name: gopls / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      IMPACT_LENS_REQUIRE_GOPLS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache: true
      - name: Install pnpm
        run: npm install --global pnpm@10.34.5
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Pinned, never @latest: the gopls preset's readiness signal (catalog.ts) is a UI string gopls
      # chose, not a documented contract, and an unpinned install would go red on an unrelated gopls
      # release with no clue why. A version bump is a deliberate, separate change.
      - name: Install gopls (pinned to the catalog's declared minimum)
        run: go install golang.org/x/tools/gopls@v0.19.1
      - name: Add Go bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # Ground truth for the version this run actually exercised, independent of what catalog.ts's
      # `lastVerified` claims - a mismatch between the two is itself a defect worth seeing in the log.
      - name: Log installed gopls version
        run: gopls version
      - name: Run Agent CLI tests (gopls required, not optional)
        run: npm run cli:test
